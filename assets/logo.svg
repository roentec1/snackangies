<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tealBalloon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6FE0D8"/>
      <stop offset="100%" stop-color="#2FB8AE"/>
    </linearGradient>
    <linearGradient id="coralBalloon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A93"/>
      <stop offset="100%" stop-color="#E85A6B"/>
    </linearGradient>
    <filter id="dropshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#00000022"/>
    </filter>
    <filter id="softshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- soft sparkle accents -->
  <g fill="#F7C948">
    <path d="M 470,70 l 5,14 14,5 -14,5 -5,14 -5,-14 -14,-5 14,-5 Z"/>
    <path d="M 510,120 l 4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 Z"/>
  </g>
  <g fill="#F6A9C0">
    <path d="M 150,85 l 4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4 Z"/>
  </g>
  <g fill="#8FE3DC">
    <circle cx="520" cy="70" r="5"/>
    <circle cx="128" cy="130" r="5"/>
  </g>

  <!-- balloon strings (drawn first, behind bouquet burst) -->
  <g fill="none" stroke="#2FB8AE" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M 320,190 C 300,250 260,255 250,300 C 244,325 262,330 258,300"/>
  </g>
  <g fill="none" stroke="#E85A6B" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M 285,195 C 270,240 230,240 225,280 C 222,300 238,305 234,280"/>
    <path d="M 355,195 C 380,245 420,245 415,285 C 412,305 396,308 400,283"/>
  </g>

  <!-- teal swirl burst behind balloons -->
  <path d="M 320,215
           C 250,225 210,270 235,320
           C 250,350 300,345 300,310
           C 300,290 275,290 270,308
           C 267,320 280,325 285,315"
        fill="none" stroke="url(#tealBalloon)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <path d="M 320,215
           C 390,225 430,270 405,320
           C 390,350 340,345 340,310
           C 340,290 365,290 370,308
           C 373,320 360,325 355,315"
        fill="none" stroke="url(#coralBalloon)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- three balloons -->
  <g filter="url(#dropshadow)">
    <!-- left coral balloon -->
    <ellipse cx="252" cy="130" rx="38" ry="46" fill="url(#coralBalloon)"/>
    <ellipse cx="240" cy="112" rx="10" ry="14" fill="#ffffff" opacity="0.35"/>
    <path d="M 252,176 L 246,188 L 258,188 Z" fill="#E85A6B"/>

    <!-- center teal balloon (tallest) -->
    <ellipse cx="320" cy="105" rx="42" ry="52" fill="url(#tealBalloon)"/>
    <ellipse cx="306" cy="84" rx="11" ry="16" fill="#ffffff" opacity="0.35"/>
    <path d="M 320,157 L 313,171 L 327,171 Z" fill="#2FB8AE"/>

    <!-- right coral balloon -->
    <ellipse cx="390" cy="132" rx="38" ry="46" fill="url(#coralBalloon)"/>
    <ellipse cx="378" cy="114" rx="10" ry="14" fill="#ffffff" opacity="0.35"/>
    <path d="M 390,178 L 384,190 L 396,190 Z" fill="#E85A6B"/>
  </g>

  <!-- small sparkles nestled among balloons -->
  <g fill="#F7C948">
    <path d="M 232,150 l 3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 Z"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <path d="M 400,150 l 3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 Z"/>
  </g>

  <!-- ribbon banner for subtitle -->
  <g transform="translate(320,318)" filter="url(#softshadow)">
    <path d="M -168,-16 L -144,0 L -168,16 Z" fill="#2FB8AE"/>
    <path d="M 168,-16 L 144,0 L 168,16 Z" fill="#2FB8AE"/>
    <rect x="-150" y="-17" width="300" height="34" rx="17" fill="#3FCBC1"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Poppins','Segoe UI',sans-serif" font-size="17" letter-spacing="3" fill="#ffffff" font-weight="700">ES HORA DE COMER!</text>
  </g>

  <!-- main wordmark -->
  <text x="320" y="410" text-anchor="middle" font-family="'Baloo 2','Poppins','Segoe UI',sans-serif" font-size="62" font-weight="800" fill="#E85A6B" stroke="#ffffff" stroke-width="2" paint-order="stroke">
    Snak's Angie's
  </text>
  <text x="320" y="410" text-anchor="middle" font-family="'Baloo 2','Poppins','Segoe UI',sans-serif" font-size="62" font-weight="800" fill="none" stroke="#2FB8AE" stroke-width="1.4" opacity="0.5">
    Snak's Angie's
  </text>

  <!-- small tagline under name -->
  <text x="320" y="436" text-anchor="middle" font-family="'Poppins','Segoe UI',sans-serif" font-size="15" letter-spacing="2" fill="#7a7a7a">
    REPOSTERÍA · DULCES · POSTRES · SORPRESAS
  </text>
</svg>
